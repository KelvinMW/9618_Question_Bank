<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; background: #f0f2f5; }
        .viewport { display: flex; height: 100vh; width: 100vw; }

        .question-pane {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .img-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-grow: 1;
            padding-top: 20px;
        }

        #zoom-target {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 60%; /* DEFAULT SET TO 60% */
            max-width: 100%;
        }

        .ms-pane {
            width: 50px;
            overflow-y: auto;
            background: #212529;
            border-left: 1px solid #dee2e6;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }

        .viewport.expanded .ms-pane {
            width: 50%;
            background: #fdfdfd;
            cursor: default;
        }

        .pane-content { padding: 20px; opacity: 0; visibility: hidden; transition: opacity 0.3s; }
        .viewport.expanded .pane-content { opacity: 1; visibility: visible; }

        .header-bar {
            background: #f8f9fa;
            padding: 14px 20px;
            border-bottom: 1px solid #dee2e6;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .viewer-header-left {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            min-width: 0;
            flex: 1 1 auto;
        }

        .viewer-title-block {
            min-width: 0;
        }

        .viewer-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #24292e;
            line-height: 1.25;
            margin-bottom: 4px;
        }

        .viewer-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-top: 6px;
        }

        .paper-chip,
        .tag-chip {
            border-radius: 999px;
            font-size: 0.72rem;
            line-height: 1.2;
            padding: 4px 9px;
            border: 1px solid #d8dee4;
        }

        .paper-chip {
            background: #eef1f4;
            color: #6b7280;
        }

        .tag-chip {
            background: white;
            color: #6f7782;
        }

        .viewer-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: flex-end;
            flex: 0 0 auto;
        }

        .back-btn {
            flex: 0 0 auto;
        }

        img { width: 100%; height: auto; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        .collapsed-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-90deg);
            white-space: nowrap;
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 0.7;
        }
        .viewport.expanded .collapsed-label { display: none; }
    </style>
</head>
<body>

<div class="viewport" id="main-viewport">
    <div class="question-pane">
        <div class="header-bar">
            <div class="header-main">
                <div class="viewer-header-left">
                    <button class="btn btn-sm btn-outline-secondary back-btn" onclick="window.close()">
                        &larr; Back
                    </button>
                    <div class="viewer-title-block">
                        <div class="viewer-title">{{ question_title }}</div>
                        <div class="viewer-meta">
                            <span class="paper-chip">{{ paper }}</span>
                            {% for tag in question_tags %}
                            <span class="tag-chip">{{ tag }}</span>
                            {% endfor %}
                        </div>
                    </div>
                </div>

                <div class="viewer-controls">
                    <div class="d-flex align-items-center bg-light border rounded px-2">
                    <label for="zoomRange" class="small me-2 text-muted">Scale:</label>
                    <input type="range" class="form-range" id="zoomRange" min="30" max="100" step="5" value="60" style="width: 120px;" oninput="updateZoom(this.value)">
                    <span id="zoomPercent" class="small ms-2 text-muted" style="min-width: 40px;">60%</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="img-wrapper">
            <div id="zoom-target">
                <img src="/crops/qp/{{ qp_img }}" alt="Question">
            </div>
        </div>
    </div>

    <div class="ms-pane" id="ms-pane" onclick="handlePaneClick(event)">
        <div class="collapsed-label">REVEAL MARK SCHEME</div>
        <div class="pane-content">
            <div class="header-bar text-success" style="margin: -20px -20px 20px -20px;">
                <span>MARK SCHEME</span>
                <button class="btn btn-sm btn-danger" onclick="closeMS(event)">Hide</button>
            </div>
            <img src="/crops/ms/{{ ms_img }}" alt="Mark Scheme">
        </div>
    </div>
</div>

<script>
    const viewport = document.getElementById('main-viewport');
    const zoomTarget = document.getElementById('zoom-target');
    const zoomSlider = document.getElementById('zoomRange');
    const zoomLabel = document.getElementById('zoomPercent');

    function updateZoom(val) {
        zoomTarget.style.width = val + "%";
        zoomLabel.innerText = val + "%";
        zoomSlider.value = val;
    }

    function handlePaneClick(e) {
        if (!viewport.classList.contains('expanded')) {
            viewport.classList.add('expanded');
            // AUTOMATICALLY ZOOM TO 100% WHEN MS IS OPENED
            updateZoom(100);
        }
    }

    function closeMS(e) {
        e.stopPropagation();
        viewport.classList.remove('expanded');
        // AUTOMATICALLY RESET TO 60% WHEN MS IS CLOSED
        updateZoom(60);
    }
</script>

</body>
</html>

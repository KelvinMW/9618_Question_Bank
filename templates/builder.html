<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --accent: #bb86fc;
            --accent-soft: rgba(187, 134, 252, 0.12);
            --ink: #2a2f36;
            --muted: #7b8491;
            --surface: #ffffff;
            --surface-alt: #f5f7fb;
        }

        body {
            margin: 0;
            background: linear-gradient(180deg, #f8faff 0%, #eef2f8 100%);
            color: var(--ink);
            min-height: 100vh;
        }

        .builder-shell {
            max-width: 1040px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .builder-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 24px;
        }

        .builder-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 6px;
        }

        .builder-subtitle {
            margin: 0;
            color: var(--muted);
        }

        .builder-card,
        .question-card {
            background: var(--surface);
            border: 1px solid #e3e8ef;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(27, 31, 36, 0.05);
        }

        .builder-card {
            padding: 18px;
            margin-bottom: 20px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .title-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 280px;
            flex: 1 1 360px;
        }

        .title-label {
            font-size: 0.78rem;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .question-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .saved-papers-card {
            padding: 18px;
        }

        .saved-papers-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }

        .saved-papers-title {
            font-size: 1rem;
            font-weight: 700;
            margin: 0;
        }

        .saved-papers-subtitle {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 0.84rem;
        }

        .saved-papers-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .saved-paper-item {
            border: 1px solid #e3e8ef;
            border-radius: 14px;
            padding: 14px 16px;
            background: #fbfcff;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
        }

        .saved-paper-item.active {
            border-color: var(--accent);
            box-shadow: inset 0 0 0 1px rgba(187, 134, 252, 0.2);
            background: #fffaff;
        }

        .saved-paper-name {
            font-size: 0.96rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .saved-paper-meta {
            color: var(--muted);
            font-size: 0.8rem;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .saved-paper-actions {
            display: flex;
            gap: 8px;
            flex: 0 0 auto;
        }

        .save-status {
            min-height: 20px;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .export-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .question-card {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: flex-start;
        }

        .question-index {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--accent-soft);
            color: #5b2d91;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex: 0 0 auto;
        }

        .question-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .question-meta {
            color: var(--muted);
            font-size: 0.82rem;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 3px 9px;
            border: 1px solid #dbe1e8;
            background: #f8fafc;
        }

        .question-actions {
            display: flex;
            gap: 8px;
            flex: 0 0 auto;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--muted);
        }

        @media (max-width: 720px) {
            .builder-header,
            .question-card {
                flex-direction: column;
            }

            .question-actions {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="builder-shell">
        <div class="builder-header">
            <div>
                <h1 class="builder-title">Paper Builder</h1>
                <p class="builder-subtitle">Reorder your selected questions, then export them as a numbered PDF.</p>
            </div>
            <a href="/" class="btn btn-outline-secondary">Back to Bank</a>
        </div>

        <div class="builder-card">
            <div class="toolbar">
                <div class="title-control">
                    <label class="title-label" for="paper-title">Paper Title</label>
                    <input type="text" class="form-control" id="paper-title" value="Custom Question Paper" placeholder="Paper title shown at the top of the PDF">
                </div>
                <div class="export-group">
                    <button type="button" class="btn btn-outline-secondary" id="save-paper-btn">Save paper</button>
                    <button type="button" class="btn btn-outline-secondary" id="save-copy-btn">Save as new</button>
                    <button type="button" class="btn btn-primary" id="generate-btn">Export Questions PDF</button>
                    <button type="button" class="btn btn-outline-primary" id="generate-ms-btn">Export Mark Scheme PDF</button>
                </div>
                <button type="button" class="btn btn-outline-secondary" id="clear-all-btn">Clear selection</button>
                <span class="text-muted small" id="question-count">0 questions selected</span>
            </div>
            <div class="save-status mt-3" id="save-status"></div>
        </div>

        <div id="question-list" class="question-list"></div>

        <div class="builder-card saved-papers-card">
            <div class="saved-papers-header">
                <div>
                    <h2 class="saved-papers-title">Saved Papers</h2>
                    <p class="saved-papers-subtitle">Saved papers store the question list so you can reopen and reuse them later.</p>
                </div>
                <span class="text-muted small" id="saved-paper-count">{{ saved_paper_count }} saved</span>
            </div>
            <div id="saved-papers-list" class="saved-papers-list"></div>
        </div>
    </div>

    <script>
        const QUESTION_STORAGE_KEY = 'qbank.paperBuilder.questions';
        const PAPER_TITLE_STORAGE_KEY = 'qbank.paperBuilder.title';
        const ACTIVE_SAVED_PAPER_KEY = 'qbank.paperBuilder.activeSavedPaperId';
        const questionList = document.getElementById('question-list');
        const questionCount = document.getElementById('question-count');
        const paperTitleInput = document.getElementById('paper-title');
        const generateButton = document.getElementById('generate-btn');
        const generateMsButton = document.getElementById('generate-ms-btn');
        const clearAllButton = document.getElementById('clear-all-btn');
        const savePaperButton = document.getElementById('save-paper-btn');
        const saveCopyButton = document.getElementById('save-copy-btn');
        const saveStatus = document.getElementById('save-status');
        const savedPapersList = document.getElementById('saved-papers-list');
        const savedPaperCount = document.getElementById('saved-paper-count');
        let savedPapers = [];

        paperTitleInput.value = localStorage.getItem(PAPER_TITLE_STORAGE_KEY) || 'Custom Question Paper';

        function loadQuestions() {
            try {
                return JSON.parse(localStorage.getItem(QUESTION_STORAGE_KEY) || '[]');
            } catch {
                return [];
            }
        }

        function saveQuestions(questions) {
            localStorage.setItem(QUESTION_STORAGE_KEY, JSON.stringify(questions));
            renderQuestions();
        }

        function loadActiveSavedPaperId() {
            return localStorage.getItem(ACTIVE_SAVED_PAPER_KEY) || '';
        }

        function saveActiveSavedPaperId(paperId) {
            if (paperId) {
                localStorage.setItem(ACTIVE_SAVED_PAPER_KEY, paperId);
            } else {
                localStorage.removeItem(ACTIVE_SAVED_PAPER_KEY);
            }
        }

        function getActiveSavedPaper() {
            const activeId = loadActiveSavedPaperId();
            return savedPapers.find((paper) => paper.id === activeId) || null;
        }

        function getDraftSignature(title, questions) {
            return JSON.stringify({
                title: (title || '').trim(),
                questions: (questions || []).map((question) => ({
                    paper: question.paper,
                    question: question.question,
                })),
            });
        }

        function hasUnsavedChanges() {
            const activePaper = getActiveSavedPaper();
            if (!activePaper) {
                return false;
            }
            return getDraftSignature(paperTitleInput.value, loadQuestions()) !== getDraftSignature(activePaper.title, activePaper.questions);
        }

        function updateSaveControls() {
            const questions = loadQuestions();
            const activePaper = getActiveSavedPaper();
            const disabled = questions.length === 0;
            const unsavedChanges = hasUnsavedChanges();

            savePaperButton.disabled = disabled;
            saveCopyButton.disabled = disabled;

            if (!questions.length) {
                saveStatus.textContent = 'Add some questions, then save the paper for later.';
                savePaperButton.textContent = 'Save paper';
                return;
            }

            if (activePaper) {
                savePaperButton.textContent = unsavedChanges ? 'Update saved paper' : 'Saved';
                saveStatus.textContent = unsavedChanges
                    ? `Editing saved paper: ${activePaper.title} (unsaved changes)`
                    : `Editing saved paper: ${activePaper.title}`;
            } else {
                savePaperButton.textContent = 'Save paper';
                saveStatus.textContent = 'Working draft not yet saved.';
            }
        }

        function moveQuestion(index, direction) {
            const questions = loadQuestions();
            const targetIndex = index + direction;

            if (targetIndex < 0 || targetIndex >= questions.length) {
                return;
            }

            const [question] = questions.splice(index, 1);
            questions.splice(targetIndex, 0, question);
            saveQuestions(questions);
        }

        function removeQuestion(index) {
            const questions = loadQuestions();
            questions.splice(index, 1);
            saveQuestions(questions);
        }

        function renderQuestions() {
            const questions = loadQuestions();
            questionCount.textContent = `${questions.length} question${questions.length === 1 ? '' : 's'} selected`;
            generateButton.disabled = questions.length === 0;
            generateMsButton.disabled = questions.length === 0;
            clearAllButton.disabled = questions.length === 0;

            if (questions.length === 0) {
                questionList.innerHTML = `
                    <div class="builder-card empty-state">
                        <p class="mb-2">No questions selected yet.</p>
                        <p class="mb-0">Go back to the bank and use the Add button on any question card.</p>
                    </div>
                `;
                updateSaveControls();
                return;
            }

            questionList.innerHTML = questions.map((question, index) => `
                <div class="question-card">
                    <div class="d-flex gap-3 flex-grow-1">
                        <div class="question-index">${index + 1}</div>
                        <div class="flex-grow-1">
                            <div class="question-title">${question.title || `Question ${question.question}`}</div>
                            <div class="question-meta">
                                <span class="pill">${question.paper}</span>
                                ${(question.tags || []).map((tag) => `<span>${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="question-actions">
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="moveQuestion(${index}, -1)">Up</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="moveQuestion(${index}, 1)">Down</button>
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeQuestion(${index})">Remove</button>
                    </div>
                </div>
            `).join('');

            updateSaveControls();
        }

        function formatSavedPaperDate(value) {
            if (!value) {
                return 'Saved recently';
            }

            const date = new Date(value);
            if (Number.isNaN(date.getTime())) {
                return 'Saved recently';
            }

            return new Intl.DateTimeFormat(undefined, {
                dateStyle: 'medium',
                timeStyle: 'short',
            }).format(date);
        }

        function renderSavedPapers() {
            const activeId = loadActiveSavedPaperId();

            if (savedPaperCount) {
                savedPaperCount.textContent = `${savedPapers.length} saved`;
            }

            if (!savedPapers.length) {
                savedPapersList.innerHTML = `
                    <div class="builder-card empty-state">
                        <p class="mb-2">No saved papers yet.</p>
                        <p class="mb-0">Save a working draft here once you want to reuse it later.</p>
                    </div>
                `;
                updateSaveControls();
                return;
            }

            savedPapersList.innerHTML = savedPapers.map((paper) => `
                <div class="saved-paper-item ${paper.id === activeId ? 'active' : ''}">
                    <div class="flex-grow-1">
                        <div class="saved-paper-name">${paper.title}</div>
                        <div class="saved-paper-meta">
                            <span class="pill">${paper.question_count} question${paper.question_count === 1 ? '' : 's'}</span>
                            <span>Updated ${formatSavedPaperDate(paper.updated_at)}</span>
                        </div>
                    </div>
                    <div class="saved-paper-actions">
                        <button type="button" class="btn btn-sm btn-outline-secondary" data-action="load" data-paper-id="${paper.id}">
                            ${paper.id === activeId ? 'Loaded' : 'Load'}
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger" data-action="delete" data-paper-id="${paper.id}">Delete</button>
                    </div>
                </div>
            `).join('');

            updateSaveControls();
        }

        async function refreshSavedPapers() {
            const response = await fetch('/api/saved-papers');
            if (!response.ok) {
                throw new Error('Failed to load saved papers');
            }

            const payload = await response.json();
            savedPapers = payload.papers || [];

            if (loadActiveSavedPaperId() && !getActiveSavedPaper()) {
                saveActiveSavedPaperId('');
            }

            renderSavedPapers();
        }

        async function saveCurrentPaper(forceNew = false) {
            const questions = loadQuestions();
            if (!questions.length) {
                return;
            }

            const title = paperTitleInput.value.trim() || 'Custom Question Paper';
            const activePaper = getActiveSavedPaper();
            const activeButton = forceNew ? saveCopyButton : savePaperButton;
            const originalLabel = activeButton.textContent;
            const shouldUpdate = Boolean(activePaper && !forceNew);

            activeButton.disabled = true;
            activeButton.textContent = shouldUpdate ? 'Updating...' : 'Saving...';

            try {
                const response = await fetch(
                    shouldUpdate ? `/api/saved-papers/${activePaper.id}` : '/api/saved-papers',
                    {
                        method: shouldUpdate ? 'PUT' : 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            title,
                            questions,
                        }),
                    }
                );

                if (!response.ok) {
                    throw new Error('Failed to save paper');
                }

                const payload = await response.json();
                const savedPaper = payload.paper;
                localStorage.setItem(PAPER_TITLE_STORAGE_KEY, savedPaper.title);
                saveActiveSavedPaperId(savedPaper.id);
                await refreshSavedPapers();
                renderQuestions();
            } catch (error) {
                alert('The paper could not be saved. Please try again.');
            } finally {
                activeButton.disabled = false;
                activeButton.textContent = originalLabel;
            }
        }

        function loadSavedPaper(paperId) {
            const savedPaper = savedPapers.find((paper) => paper.id === paperId);
            if (!savedPaper) {
                return;
            }

            localStorage.setItem(QUESTION_STORAGE_KEY, JSON.stringify(savedPaper.questions));
            localStorage.setItem(PAPER_TITLE_STORAGE_KEY, savedPaper.title);
            paperTitleInput.value = savedPaper.title;
            saveActiveSavedPaperId(savedPaper.id);
            renderQuestions();
            renderSavedPapers();
        }

        async function deleteSavedPaper(paperId) {
            const savedPaper = savedPapers.find((paper) => paper.id === paperId);
            if (!savedPaper) {
                return;
            }

            if (!confirm(`Delete "${savedPaper.title}"?`)) {
                return;
            }

            const response = await fetch(`/api/saved-papers/${paperId}`, {
                method: 'DELETE',
            });

            if (!response.ok) {
                alert('The saved paper could not be deleted. Please try again.');
                return;
            }

            if (loadActiveSavedPaperId() === paperId) {
                saveActiveSavedPaperId('');
            }

            await refreshSavedPapers();
            renderQuestions();
        }

        async function generatePaper(exportType) {
            const questions = loadQuestions();
            if (!questions.length) {
                return;
            }

            const activeButton = exportType === 'markscheme' ? generateMsButton : generateButton;
            const originalLabel = activeButton.textContent;
            activeButton.disabled = true;
            activeButton.textContent = 'Generating...';

            try {
                const response = await fetch('/generate-paper', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title: paperTitleInput.value.trim() || (exportType === 'markscheme' ? 'Custom Mark Scheme' : 'Custom Question Paper'),
                        export_type: exportType,
                        questions,
                    }),
                });

                if (!response.ok) {
                    throw new Error('Failed to generate PDF');
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                const baseName = (paperTitleInput.value.trim() || (exportType === 'markscheme' ? 'Custom Mark Scheme' : 'Custom Question Paper')).replace(/[^A-Za-z0-9._-]+/g, '_');
                const prefix = exportType === 'markscheme' ? 'ms_' : 'qp_';
                link.download = `${prefix}${baseName}.pdf`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
            } catch (error) {
                alert('The PDF could not be generated. Please try again.');
            } finally {
                activeButton.disabled = false;
                activeButton.textContent = originalLabel;
            }
        }

        clearAllButton.addEventListener('click', () => {
            localStorage.removeItem(QUESTION_STORAGE_KEY);
            saveActiveSavedPaperId('');
            renderQuestions();
            renderSavedPapers();
        });

        paperTitleInput.addEventListener('input', () => {
            localStorage.setItem(PAPER_TITLE_STORAGE_KEY, paperTitleInput.value);
            updateSaveControls();
        });

        savePaperButton.addEventListener('click', () => saveCurrentPaper(false));
        saveCopyButton.addEventListener('click', () => saveCurrentPaper(true));
        generateButton.addEventListener('click', () => generatePaper('questions'));
        generateMsButton.addEventListener('click', () => generatePaper('markscheme'));

        savedPapersList.addEventListener('click', (event) => {
            const button = event.target.closest('button[data-action][data-paper-id]');
            if (!button) {
                return;
            }

            const paperId = button.dataset.paperId;
            const action = button.dataset.action;

            if (action === 'load') {
                loadSavedPaper(paperId);
            } else if (action === 'delete') {
                deleteSavedPaper(paperId);
            }
        });

        window.moveQuestion = moveQuestion;
        window.removeQuestion = removeQuestion;

        refreshSavedPapers().catch(() => {
            saveStatus.textContent = 'Saved papers could not be loaded right now.';
        });
        renderQuestions();
    </script>
</body>
</html>
